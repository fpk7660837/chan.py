services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: chan-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-chan}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Asia/Shanghai
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ${MARKET_DATA_ROOT}/clickhouse/data:/var/lib/clickhouse
      - ${MARKET_DATA_ROOT}/clickhouse/logs:/var/log/clickhouse-server
      - ${MARKET_DATA_ROOT}/clickhouse/config:/etc/clickhouse-server/config.d/host
      - ${MARKET_DATA_ROOT}/backup/clickhouse:/var/lib/clickhouse/backups
      - ${MARKET_DATA_ROOT}/parquet:/market-data/parquet
      - ./config/backup_disk.xml:/etc/clickhouse-server/config.d/backup_disk.xml:ro
      - ./init:/docker-entrypoint-initdb.d:ro
